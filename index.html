<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prime8s Cinema Pro (Self-Hosted)</title>
  <style>
    :root { --bg: #0a0a0a; --sidebar: #151515; --accent: #00ff88; --text: #eee; --panel: #222; }
    body { margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    #sidebar { width: 320px; background: var(--sidebar); border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); z-index: 10; transition: margin-left 0.3s ease; overflow-y: auto; }
    body.theater-mode #sidebar { margin-left: -360px; }
    h2 { margin-top: 0; color: var(--accent); font-size: 1.5rem; letter-spacing: -1px; }
    .group { margin-bottom: 25px; border-bottom: 1px solid #222; padding-bottom: 15px; }
    label { display: block; font-size: 11px; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    input[type="number"], input[type="text"] { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: white; border-radius: 8px; font-size: 16px; outline: none; box-sizing: border-box; }
    input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent); }
    .light-val { float: right; color: var(--accent); font-weight: bold; }
    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-small { background: #222; border: 1px solid #444; color: #ccc; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }
    .btn-small:hover { border-color: var(--accent); color: var(--accent); }
    #fav-container { flex-grow: 1; margin-top: 10px; }
    .fav-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--panel); margin-bottom: 5px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .fav-item:hover { background: #2a2a2a; color: var(--accent); }

    #viewport { flex-grow: 1; position: relative; }
    #viewerHost { position: absolute; inset: 0; }

    .toolbar { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; background: rgba(0,0,0,0.85); padding: 10px 20px; border-radius: 100px; border: 1px solid #444; backdrop-filter: blur(12px); z-index: 50; }
    button { background: #333; color: white; border: none; padding: 10px 18px; border-radius: 50px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; font-size: 13px; }
    button:hover { background: var(--accent); color: black; }
    .toggle-theater { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.5); border: 1px solid #444; }
    .export-btn { font-size: 10px; padding: 8px; margin-top: 10px; border: 1px solid #444; background: transparent; color: #666; width: 100%; cursor: pointer; }

    /* Loading overlay */
    #loading { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background: rgba(0,0,0,0.55); z-index: 40; }
    #loading .pill { padding: 10px 14px; border-radius: 999px; border: 1px solid #333; background: rgba(0,0,0,0.75); color: #fff; font-size: 13px; }
    #err { position:absolute; top: 20px; right: 20px; max-width: 520px; background: rgba(120,0,0,0.85); border: 1px solid rgba(255,255,255,0.15); padding: 12px 14px; border-radius: 12px; display:none; z-index: 200; }
    #err b { display:block; margin-bottom: 6px; }
  </style>
</head>
<body class="theater-mode">
  <div id="sidebar">
    <h2>Prime8s Pro</h2>

    <div class="group">
      <label>Character ID</label>
      <input type="number" id="idInput" value="1" min="1" max="3333">
    </div>

    <div class="group">
      <label>Lighting Presets</label>
      <div class="preset-grid">
        <button class="btn-small" id="presetStandard">Standard</button>
        <button class="btn-small" id="presetWarm">Warm Key</button>
        <button class="btn-small" id="presetCool">Cool Key</button>
        <button class="btn-small" id="presetStudio">Pro Studio</button>
      </div>
    </div>

    <div class="group">
      <label>Intensity <span id="lightValDisplay" class="light-val">1.0</span></label>
      <input type="range" id="lightSlider" min="0.1" max="3.0" step="0.1" value="1.0">
    </div>

    <div id="fav-container">
      <label>Favorites</label>
      <div id="favList"></div>
      <button class="export-btn" id="exportFavs">💾 Export List</button>
    </div>
  </div>

  <div id="viewport">
    <button class="toggle-theater" id="toggleTheater" title="Toggle Sidebar (T)">☰</button>
    <div id="viewerHost"></div>
    <div id="loading"><div class="pill">Loading Prime8…</div></div>
    <div id="err"><b>Viewer error</b><div id="errMsg"></div></div>

    <div class="toolbar">
      <button id="prevBtn">←</button>
      <button id="randBtn">🎲 Random</button>
      <button id="favBtn" style="color:#ffcc00">⭐ Save</button>
      <button id="copyBtn">🔗 Link</button>
      <button id="nextBtn">→</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
